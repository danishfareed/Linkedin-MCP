name: Bug report
description: Something else isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error output
      description: The tool's error JSON (code, message, next_step). Remove personal data.
      render: text
  - type: input
    id: client
    attributes:
      label: MCP client and OS
      placeholder: e.g. Claude Desktop on macOS 15
  - type: input
    id: version
    attributes:
      label: linkedin-mcp version
